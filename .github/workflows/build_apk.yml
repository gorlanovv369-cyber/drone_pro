name: Build Android APK

on:
push:
branches: [ main, master ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
- name: Checkout code
  uses: actions/checkout@v4

- name: Build with Buildozer
  uses: kivy/build-action@v1
  with:
    arg: android debug

- name: Upload APK artifact
  uses: actions/upload-artifact@v4
  with:
    name: drone-gcs-apk
    path: bin/*.apk
